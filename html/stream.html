<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Stream Preview — AH4C</title>
	<link rel="stylesheet" href="/static/css/ah4c.css?v=3">
	<script src="/static/js/theme.js?v=3"></script>
	<script src="https://unpkg.com/mpegts.js/dist/mpegts.js"></script>
</head>
<body>
	<div class="pagebar">
		<a href="/"><img class="pagebar-logo" src="/static/logos/androidhdmi-for-channels.jpeg" alt="AH4C"></a>
		<strong>Stream Preview</strong>
		
		<button class="btn btn-sm btn-icon theme-toggle" onclick="toggleTheme()" title="Toggle theme">
			<svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="7" y2="7"/><line x1="17" y1="17" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="7" y2="17"/><line x1="17" y1="7" x2="19.1" y2="4.9"/></svg>
			<svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
			</button>
	</div>

	<div class="page">

		<div class="card">
			<div class="field">
				<label for="tunerSelect">Select Tuner</label>
				<select name="tuner" id="tunerSelect">
				    {{ range .TunerIndices }}
				        <option value="{{ . }}">Tuner {{ . }}</option>
				    {{ end }}
				</select>
			</div>
			<video id="videoElement" controls></video>
		</div>
	</div>
	<script>
			document.getElementById("tunerSelect").addEventListener("change", function(e) {
			var index = e.target.value;
			var player = mpegts.createPlayer({
				type: 'mse',
				isLive: true,
				url: '/video?index=' + index
			}, {
				isLive: true
			});
			var videoElement = document.getElementById('videoElement');
			player.attachMediaElement(videoElement);
			videoElement.addEventListener('loadedmetadata', function() {
				// Seek to the end of the video
				videoElement.currentTime = videoElement.duration;
			}, { once: true });
			player.load();
			player.play();
		});
	</script>
</body>
</html>
