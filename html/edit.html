<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Editor — AH4C</title>
    <link rel="stylesheet" href="/static/css/ah4c.css">
    <style>
        textarea {
            height: calc(100vh - 130px);
        }
    </style>
</head>
<body>
    <div class="page page--wide">
        <div class="pagebar" style="position:static;border-radius:var(--radius-sm);margin-bottom:0.8rem;">
            <strong>Text Editor</strong>
            <a href="/" style="margin-left:auto;">Home</a>
        </div>
        <form action="/save" method="POST">
            <textarea name="content">{{ .content }}</textarea>
            <div class="btn-row">
                <input type="submit" class="btn btn-success" value="Save">
            </div>
        </form>
    </div>
</body>
</html>
