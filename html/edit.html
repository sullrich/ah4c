<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Editor — AH4C</title>
    <link rel="stylesheet" href="/static/css/ah4c.css">
</head>
<body>
    <div class="page page--wide">
        <div class="pagebar pagebar--inline">
            <a href="/"><img class="pagebar-logo" src="/static/logos/androidhdmi-for-channels.jpeg" alt="AH4C"></a>
            <strong>Text Editor</strong>
            <nav class="nav push-right">
                <a href="/">Home</a>
                <a href="/device">Device Control</a>
                <a href="/status">Activity</a>
                <a href="/status/andlogs">Activity &amp; Logs</a>
                <a href="/logs">Logs</a>
                <a href="/m3us">Channel M3Us</a>
                <a href="/routes">API Routes</a>
            </nav>
        </div>
        <form action="/save" method="POST">
            <textarea name="content" class="editor">{{ .content }}</textarea>
            <div class="btn-row">
                <input type="submit" class="btn btn-success" value="Save">
            </div>
        </form>
    </div>
</body>
</html>
