<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Routes — AH4C</title>
    <link rel="stylesheet" href="/static/css/ah4c.css?v=3">
    <script src="/static/js/theme.js?v=3"></script>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a class="brand" href="/">
                <img src="/static/logos/androidhdmi-for-channels.jpeg" alt="AH4C">
                <span>API Routes<small>AH4C</small></span>
            </a>
            <nav class="nav">
                <a href="/">Home</a>
                <a href="/device">Device Control</a>
                <a href="/status">Activity</a>
                <a href="/status/andlogs">Activity &amp; Logs</a>
                <a href="/logs">Logs</a>
                <a href="/m3us">Channel M3Us</a>
                <a href="/routes" class="active">API Routes</a>
            </nav>
            <button class="btn btn-sm btn-icon theme-toggle" onclick="toggleTheme()" title="Toggle theme">
            	<svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="7" y2="7"/><line x1="17" y1="17" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="7" y2="17"/><line x1="17" y1="7" x2="19.1" y2="4.9"/></svg>
            	<svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
        </div>

        <div class="card">
            <div class="table-wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>HTTP Method</th>
                            <th>Path</th>
                            <th>Handler</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{ range . }}
                        <tr>
                            <td><span class="badge badge-idle">{{ .Method }}</span></td>
                            <td class="mono">{{ .Path }}</td>
                            <td class="mono muted">{{ .Handler }}</td>
                        </tr>
                        {{ end }}
                    </tbody>
                </table>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn btn-danger" onclick="cancel()">Cancel</button>
        </div>
    </div>
    <script>
        function cancel() {
            window.location.href = "/";
        }
    </script>
</body>
</html>
