<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Available Routes — AH4C</title>
    <link rel="stylesheet" href="/static/css/ah4c.css">
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a class="brand" href="/">
                <img src="/static/logos/androidhdmi-for-channels.jpeg" alt="AH4C">
                <span>API Routes<small>AH4C</small></span>
            </a>
        </div>

        <div class="card">
            <div class="table-wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>HTTP Method</th>
                            <th>Path</th>
                            <th>Handler</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{ range . }}
                        <tr>
                            <td><span class="badge badge-idle">{{ .Method }}</span></td>
                            <td class="mono">{{ .Path }}</td>
                            <td class="mono muted">{{ .Handler }}</td>
                        </tr>
                        {{ end }}
                    </tbody>
                </table>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn btn-danger" onclick="cancel()">Cancel</button>
        </div>
    </div>
    <script>
        function cancel() {
            window.location.href = "/";
        }
    </script>
</body>
</html>
