<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuner Status — AH4C</title>
    <link rel="stylesheet" href="/static/css/ah4c.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flot/0.8.3/jquery.flot.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flot/0.8.3/jquery.flot.time.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flot/0.8.3/jquery.flot.navigate.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flot/0.8.3/jquery.flot.selection.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flot/0.8.3/jquery.flot.crosshair.min.js"></script>
    <script src="https://unpkg.com/mpegts.js/dist/mpegts.js"></script>
</head>
<body>
    <div id="tooltip" class="flot-tooltip"></div>

    <div class="pagebar" id="pageNav">
        <strong>Activity</strong>
        <nav class="nav push-right">
            <a href="/">Home</a>
            <a href="/device">Device</a>
            <a href="/status" class="active">Activity</a>
            <a href="/status/andlogs">Activity &amp; Logs</a>
            <a href="/logs">Logs</a>
            <a href="/m3us">M3Us</a>
            <a href="/routes">Routes</a>
        </nav>
    </div>

    <div class="page page--wide">
        <div class="status-columns">
            <div class="card">
                <div class="card-title">System Stats</div>
                <div class="stat-grid" id="systemStats"></div>
            </div>
            <div class="card">
                <div class="card-title"><span class="live-dot"></span> DVR Activity <span id="activity" class="hint"></span></div>
                <div class="activity-feed">
                    <table id="activityTable"></table>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                Tuners
                <span class="topbar-actions">
                    <button class="btn btn-sm" onclick="controlAll('wake')">Wake all</button>
                    <button class="btn btn-sm" onclick="controlAll('sleep')">Sleep all</button>
                    <button class="btn btn-danger btn-sm" onclick="if(confirm('Reboot ALL tuner devices?'))controlAll('reboot')">Reboot all</button>
                </span>
            </div>
            <div class="tuner-status-grid" id="tunerGrid"></div>
        </div>

        <div class="card">
            <div class="card-title">Active Streams</div>
            <div class="table-wrap">
                <table class="table" id="readerStatus"></table>
            </div>
        </div>

        <div class="card">
            <div class="card-title">CPU &amp; Memory Usage (%)</div>
            <div id="cpu-usage" class="chart"></div>
        </div>

        <div class="card">
            <div class="card-title">Network In/Out (Megabit)</div>
            <div id="network-io" class="chart"></div>
        </div>

        <div class="card">
            <div class="card-title">GPU Usage (%)</div>
            <div id="gpu-usage" class="chart"></div>
        </div>
    </div>

    <div class="modal-overlay" id="tunerModal">
        <div class="modal">
            <div class="modal-head">
                <span class="tuner-number" id="modalTunerNumber"></span>
                <h3 id="modalTitle">Tuner</h3>
                <button class="btn btn-sm modal-close" onclick="closeTunerModal()">Close</button>
            </div>
            <video id="modalVideo" controls muted></video>
            <p class="modal-hint" id="modalHint">Live view direct from this tuner's encoder.</p>
            <div class="remote">
                <div class="remote-dpad">
                    <span></span>
                    <button class="btn" onclick="sendKey('up')" title="Up"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 14 12 8 18 14"/></svg></button>
                    <span></span>
                    <button class="btn" onclick="sendKey('left')" title="Left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="14 6 8 12 14 18"/></svg></button>
                    <button class="btn dpad-center" onclick="sendKey('select')" title="Select">OK</button>
                    <button class="btn" onclick="sendKey('right')" title="Right"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="10 6 16 12 10 18"/></svg></button>
                    <span></span>
                    <button class="btn" onclick="sendKey('down')" title="Down"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 10 12 16 18 10"/></svg></button>
                    <span></span>
                </div>
                <div class="remote-keys">
                    <button class="btn btn-sm" onclick="sendKey('back')">Back</button>
                    <button class="btn btn-sm" onclick="sendKey('home')">Home</button>
                    <button class="btn btn-sm" onclick="sendKey('play')">Play / Pause</button>
                    <button class="btn btn-sm" onclick="sendKey('wake')">Wake</button>
                    <button class="btn btn-sm" onclick="sendKey('sleep')">Sleep</button>
                    <button class="btn btn-danger btn-sm" onclick="if(confirm('Reboot this device?'))sendKey('reboot')">Reboot</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (window.self !== window.top) document.getElementById('pageNav').classList.add('hidden');
    </script>
    <script>
        var modalIndex = null;
        var player = null;
        var tunerIps = [];

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
            });
        }

        function openTunerModal(index) {
            modalIndex = index;
            $('#modalTunerNumber').text(index);
            $('#modalTitle').text('Tuner ' + index + ' — ' + (tunerIps[index] || ''));
            $('#tunerModal').addClass('open');
            startPreview(index);
        }

        function closeTunerModal() {
            $('#tunerModal').removeClass('open');
            stopPreview();
            modalIndex = null;
        }

        var stallTimer = null;
        var lastFrames = -1;
        var stallTicks = 0;

        function startPreview(index) {
            stopPreview();
            if (!window.mpegts || !mpegts.isSupported()) return;
            var videoElement = document.getElementById('modalVideo');
            player = mpegts.createPlayer({
                type: 'mse',
                isLive: true,
                url: '/api/tuner/' + index + '/preview'
            }, {
                isLive: true
            });
            player.attachMediaElement(videoElement);
            videoElement.addEventListener('loadedmetadata', function() {
                videoElement.currentTime = videoElement.duration;
            }, { once: true });
            player.load();
            player.play().catch(function() {});
            startWatchdog();
        }

        function stopPreview() {
            stopWatchdog();
            if (player) {
                player.destroy();
                player = null;
            }
        }

        function startWatchdog() {
            lastFrames = -1;
            stallTicks = 0;
            stallTimer = setInterval(function() {
                if (!player || modalIndex === null) return;
                if (document.getElementById('modalVideo').paused) {
                    stallTicks = 0;
                    return;
                }
                var frames = (player.statisticsInfo || {}).decodedFrames || 0;
                if (frames === lastFrames) {
                    stallTicks++;
                    if (stallTicks >= 3) {
                        startPreview(modalIndex);
                        return;
                    }
                } else {
                    stallTicks = 0;
                }
                lastFrames = frames;
            }, 2000);
        }

        function stopWatchdog() {
            if (stallTimer) {
                clearInterval(stallTimer);
                stallTimer = null;
            }
        }

        function sendKey(action) {
            if (modalIndex === null) return;
            $.post('/api/tuner/' + modalIndex + '/control/' + action).fail(function() {
                var hint = $('#modalHint');
                hint.text('Control failed — this device may not be reachable over adb.');
                setTimeout(function() {
                    hint.text("Live view direct from this tuner's encoder.");
                }, 4000);
            });
        }

        function controlAll(action) {
            $.post('/api/tuners/control/' + action);
        }

        $('#tunerModal').on('click', function(e) {
            if (e.target === this) closeTunerModal();
        });
        $(document).on('keydown', function(e) {
            if (e.key === 'Escape') closeTunerModal();
        });
    </script>
    <script>
		$(document).ready(function() {
            function showTooltip(x, y, contents) {
                $("#tooltip").css({
                    top: y + 5,
                    left: x + 5
                }).html(contents).fadeIn(200);
            }
            // CPU & Memory Usage tooltips
            $("#cpu-usage").bind("plothover", function(event, pos, item) {
                if (item) {
                    var x = item.datapoint[0],
                        y = item.datapoint[1].toFixed(2);
                    var content = item.series.label + ": " + y;
                    showTooltip(item.pageX, item.pageY, content);
                } else {
                    $("#tooltip").hide();
                }
            });
            // Network In/Out tooltips
            $("#network-io").bind("plothover", function(event, pos, item) {
                if (item) {
                    var x = item.datapoint[0],
                        y = item.datapoint[1].toFixed(2);
                    var content = item.series.label + ": " + y + " Mbps";
                    showTooltip(item.pageX, item.pageY, content);
                } else {
                    $("#tooltip").hide();
                }
            });
		    var cpuData = [];
		    var memoryData = [];
		    var networkInData = [];
		    var networkOutData = [];
		    var prevNetRecv = null;
		    var prevNetSent = null;
		    var prevTimestamp = Date.now();
			var megabitsSentPerSecond = 0
			var megabitsRecvPerSecond = 0
			var networkInMegabits = 0;
		    var networkOutMegabits = 0;
			var showplotscpu = false;
			var showplotsnet = false;
            var gpuCPUData = [];
            var gpuMemData = [];
            var gpuPowerData = [];

            function statTile(label, value) {
                return `<div class="stat-tile"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`;
            }

			// Function to fetch and update data
		    function fetchDataAndUpdate() {
		        // Fetch data from /api/status
		        $.getJSON("/api/status", function(data) {
		            var currentTimestamp = Date.now();

		            // Populate System Stats
		            var systemStatsHtml =
		                statTile('CPU', `${data.CPU}<small>%</small>`) +
		                statTile('Memory', `${data.Memory}<small>%</small>`) +
		                statTile('Disk', `${data.Disk}<small>%</small>`) +
		                statTile('Net In (total)', `${data.NetRecv}<small> bytes</small>`) +
		                statTile('Net Out (total)', `${data.NetSent}<small> bytes</small>`) +
		                statTile('Net In (rate)', `${networkInMegabits}<small> Mbps</small>`) +
		                statTile('Net Out (rate)', `${networkOutMegabits}<small> Mbps</small>`);

					if(data.GPUCPUUsage) {
						systemStatsHtml +=
						    statTile('GPU', `${data.GPUCPUUsage}<small>%</small>`) +
						    statTile('GPU Memory', `${data.GPUMemUsage}<small>%</small>`) +
						    statTile('GPU Power', `${data.GPUPowerUsage}<small>%</small>`);
					}

		            $('#systemStats').html(systemStatsHtml);

		            // Populate Tuner cards
		            tunerIps = $.map(data.Tuners, function(t) { return t.Tunerip; });
		            var tunerHtml = '';
		            $.each(data.Tuners, function(index, tuner) {
		                var badge = tuner.Active
		                    ? `<span class="badge badge-active">Streaming</span>`
		                    : `<span class="badge badge-idle">Idle</span>`;
		                tunerHtml += `
		                    <div class="tuner-status-card ${tuner.Active ? 'is-active' : ''}">
		                        <div class="tuner-status-head">
		                            <span class="tuner-number">${index}</span>
		                            <strong>Tuner ${index}</strong>
		                            ${badge}
		                        </div>
		                        <div class="tuner-pairing">
		                            <div class="tuner-endpoint">
		                                <div class="endpoint-label">Device</div>
		                                <div class="endpoint-value">${esc(tuner.Tunerip) || '—'}</div>
		                            </div>
		                            <div class="pair-link">⇄</div>
		                            <div class="tuner-endpoint">
		                                <div class="endpoint-label">Encoder</div>
		                                <div class="endpoint-value">${esc(tuner.Url) || '—'}</div>
		                            </div>
		                        </div>
		                        <div class="tuner-actions">
		                            <button class="btn btn-sm" onclick="openTunerModal(${index})">View &amp; control</button>
		                        </div>
		                    </div>
		                `;
		            });
		            $('#tunerGrid').html(tunerHtml);

		            // Populate Reader Status
		            var readerStatusHtml = `
		                <tr>
		                    <th>Tuner</th>
		                    <th>Channel</th>
		                    <th>Started</th>
		                    <th>File</th>
		                    <th>CMD</th>
		                </tr>`;
		            if (!data.Readers || !data.Readers.length) {
		                readerStatusHtml += `<tr><td colspan="5" class="muted">No active streams</td></tr>`;
		            }
		            $.each(data.Readers, function(index, reader) {
		                readerStatusHtml += `
		                    <tr>
		                        <td class="num">${reader.T}</td>
		                        <td>${esc(reader.Channel)}</td>
		                        <td>${esc(reader.Started)}</td>
		                        <td class="mono">${esc(reader.FileName)}</td>
		                        <td class="mono">${esc(reader.Cmd)}</td>
		                    </tr>
		                `;
		            });
		            $('#readerStatus').html(readerStatusHtml);

					if (prevNetRecv !== null && prevNetSent !== null) {
						var timeInterval = (currentTimestamp - prevTimestamp) / 1000; // in seconds
						var deltaNetRecv = data.NetRecv - prevNetRecv; // in bytes
						var deltaNetSent = data.NetSent - prevNetSent; // in bytes

						// convert bytes per second to megabits per second
						networkInMegabits = Math.round(((deltaNetRecv * 8) / timeInterval) / 1048576);
						networkOutMegabits = Math.round(((deltaNetSent * 8) / timeInterval) / 1048576);
					}

		            prevNetRecv = Math.round(data.NetRecv)
					prevNetSent = Math.round(data.NetSent)
		            prevTimestamp = currentTimestamp

					var CPUoptions = {
					    xaxis: {
					        mode: "time",
							timezone: "browser", // Using browser's local timezone
					        timeformat: "%H:%M:%S", // Format of the time
							ticks: 5,
							labelMargin: 15
					    },
					    yaxis: {
					        axisLabel: 'Percentage (%)', // Y-axis label
					        min: 0, // Fix the minimum value for Y-axis
					        max: 100 // Fix the maximum value for Y-axis
					    },
						crosshair: { mode: "x" },
					    grid: {
					        hoverable: true,
					        clickable: true,
					        borderWidth: 1,
					        borderColor: "#24304a",
					        markings: function(axes) {
					            var markings = [];
					            for (var y = Math.floor(axes.ymin); y < axes.ymax; y += 10) {
					                markings.push({ yaxis: { from: y, to: y + 5 }, color: "rgba(99, 102, 241, 0.04)" });
					            }
					            return markings;
					        }
					    },
						selection: { mode: "xy" },
						lines: { show: true, fill: true, lineWidth: 3 },
						points: { show: showplotscpu },
					    colors: ["#8b5cf6", "#6366f1"]
					};

					var NEToptions = {
					    xaxis: {
					        mode: "time",
							timezone: "browser", // Using browser's local timezone
					        timeformat: "%H:%M:%S", // Format of the time
							ticks: 5,
							labelMargin: 15
					    },
						crosshair: { mode: "x" },
					    grid: {
					        hoverable: true,
					        clickable: true,
					        borderWidth: 1,
					        borderColor: "#24304a",
					        markings: function(axes) {
					            var markings = [];
					            for (var y = Math.floor(axes.ymin); y < axes.ymax; y += 10) {
					                markings.push({ yaxis: { from: y, to: y + 5 }, color: "rgba(99, 102, 241, 0.04)" });
					            }
					            return markings;
					        }
					    },
						selection: { mode: "xy" },
						lines: { show: true, fill: true, lineWidth: 3 },
						points: { show: showplotsnet },
					    colors: ["#38bdf8", "#34d399"],
					};

					var GPUoptions = {
					    xaxis: {
					        mode: "time",
							timezone: "browser", // Using browser's local timezone
					        timeformat: "%H:%M:%S", // Format of the time
							ticks: 5,
							labelMargin: 15
					    },
					    yaxis: {
					        axisLabel: 'Percentage (%)', // Y-axis label
					        min: 0, // Fix the minimum value for Y-axis
					        max: 100 // Fix the maximum value for Y-axis
					    },
						crosshair: { mode: "x" },
					    grid: {
					        hoverable: true,
					        clickable: true,
					        borderWidth: 1,
					        borderColor: "#24304a",
					        markings: function(axes) {
					            var markings = [];
					            for (var y = Math.floor(axes.ymin); y < axes.ymax; y += 10) {
					                markings.push({ yaxis: { from: y, to: y + 5 }, color: "rgba(99, 102, 241, 0.04)" });
					            }
					            return markings;
					        }
					    },
						selection: { mode: "xy" },
						lines: { show: true, fill: true, lineWidth: 3 },
						points: { show: showplotsnet },
					    colors: ["#6366f1", "#f59e0b", "#34d399"],
					};

					// Update the placeholder arrays
					cpuData.push([currentTimestamp, data.CPU]); // Using currentTimestamp as the x-axis value
					memoryData.push([currentTimestamp, data.Memory]); // Using currentTimestamp as the x-axis value
					networkInData.push([currentTimestamp, networkInMegabits]); // Using currentTimestamp as the x-axis value
					networkOutData.push([currentTimestamp, networkOutMegabits]); // Using currentTimestamp as the x-axis value

                    // GPU data
                    gpuCPUData.push([currentTimestamp, data.GPUCPUUsage]);
                    gpuMemData.push([currentTimestamp, data.GPUMemUsage]);
                    gpuPowerData.push([currentTimestamp, data.GPUPowerUsage]);

					// Limit the size of the arrays to avoid memory issues
					if (cpuData.length > 50) cpuData.shift();
					if (memoryData.length > 50) memoryData.shift();
					if (networkInData.length > 50) networkInData.shift();
					if (networkOutData.length > 50) networkOutData.shift();
                    if (gpuCPUData.length > 50) gpuCPUData.shift();
                    if (gpuMemData.length > 50) gpuMemData.shift();
                    if (gpuPowerData.length > 50) gpuPowerData.shift();

                    // plot GPU graph
                    $.plot("#gpu-usage", [
                        { data: gpuCPUData, label: "GPU CPU %" },
                        { data: gpuMemData, label: "GPU Mem %" },
                        { data: gpuPowerData, label: "GPU Power %" }
                    ], GPUoptions);

					// Plot the data
					$.plot("#cpu-usage", [
						{ data: cpuData, label: "CPU %" },
						{ data: memoryData, label: "Mem %" }
					], CPUoptions);
					$.plot("#network-io", [
						{ data: networkInData, label: "In" },
						{ data: networkOutData, label: "Out" }
					], NEToptions);

					// Toggle points on hover
					$("#cpu-usage").on("mouseenter", function() {
					    CPUoptions.points.show = true;
						showplotscpu = true;
					    plot = $.plot("#cpu-usage", [
					        { data: cpuData, label: "CPU %" },
					        { data: memoryData, label: "Mem %" }
					    ], CPUoptions);
					});

					$("#cpu-usage").on("mouseleave", function() {
					    CPUoptions.points.show = false;
						showplotscpu = false;
					    plot = $.plot("#cpu-usage", [
					        { data: cpuData, label: "CPU %" },
					        { data: memoryData, label: "Mem %" }
					    ], CPUoptions);
					});

					// Toggle points on hover
					$("#network-io").on("mouseenter", function() {
					    NEToptions.points.show = true;
						showplotsnet = true;
					    plot = $.plot("#network-io", [
					        { data: networkInData, label: "In" },
					        { data: networkOutData, label: "Out" }
					    ], NEToptions);
					});

					$("#network-io").on("mouseleave", function() {
					    NEToptions.points.show = false;
						showplotsnet = false;
					    plot = $.plot("#network-io", [
					        { data: networkInData, label: "In" },
					        { data: networkOutData, label: "Out" }
					    ], NEToptions);
					});

		        });

		    }

		    // Fetch data and update immediately
		    fetchDataAndUpdate();

		    // Set interval to fetch data every 5 seconds (5000 milliseconds)
		    setInterval(fetchDataAndUpdate, 5000);
		});
    </script>
    <script>
        $(document).ready(function() {
            function fetchDataAndUpdateDVR() {
                // Fetch data from /dvr
                $.getJSON("/status/channelsactivity", function(data) {
					statusA = data.busy;
					if(statusA == false) {
						status = "— Idle";
					} else {
						status = "— Active";
					}
					$('#activity').text(status);
					// Populate Activity Table
                    var activityHtml = ``;
					var isempty = true;
                    $.each(data.activity, function(key, details) {
                        activityHtml += `
                            <tr>
                                <td>${details}</td>
                            </tr>
                        `;
						isempty = false;
                    });
					if(isempty == true) {
						var activityHtml = `<tr><td>&nbsp;</td></tr>`;
					}
                    $('#activityTable').html(activityHtml);
                });
            }
            // Fetch data and update immediately
            fetchDataAndUpdateDVR();
            // Set interval to fetch data every 1 seconds (1000 milliseconds)
            setInterval(fetchDataAndUpdateDVR, 3000);
        });
    </script>
</body>
</html>
