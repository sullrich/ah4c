<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Activity &amp; Logs — AH4C</title>
	<link rel="stylesheet" href="/static/css/ah4c.css">
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
	<div class="shell">
		<div class="pagebar">
			<strong>Activity &amp; Logs</strong>
			<span>Last updated: <span id="last-update"></span></span>
			<a href="/" class="push-right">Home</a>
		</div>
		<div class="shell-body">
			<div class="split">
				<div class="split-pane split-left">
					<iframe src="/status"></iframe>
				</div>
				<div class="split-pane split-right">
					<iframe src="/logs?notime"></iframe>
				</div>
			</div>
		</div>
	</div>
	<script>
		function fetchLogs() {
			var now = new Date();
			$('#last-update').text(now.toLocaleString());
		}
		fetchLogs();
		setInterval(fetchLogs, 1000);
	</script>
</body>
</html>
