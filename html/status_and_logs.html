<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Activity &amp; Logs — AH4C</title>
	<link rel="stylesheet" href="/static/css/ah4c.css">
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
	<div class="shell">
		<div class="pagebar">
			<strong>Activity &amp; Logs</strong>
			<span>Last updated: <span id="last-update"></span></span>
			<button class="btn btn-sm" id="expandLogs" onclick="toggleLogs()">Expand logs</button>
			<nav class="nav push-right">
				<a href="/">Home</a>
				<a href="/device">Device Control</a>
				<a href="/status">Activity</a>
				<a href="/status/andlogs" class="active">Activity &amp; Logs</a>
				<a href="/logs">Logs</a>
				<a href="/m3us">Channel M3Us</a>
				<a href="/routes">API Routes</a>
			</nav>
		</div>
		<div class="shell-body">
			<div class="split" id="split">
				<div class="split-pane split-left">
					<iframe src="/status"></iframe>
				</div>
				<div class="split-pane split-right">
					<iframe src="/logs?notime"></iframe>
				</div>
			</div>
		</div>
	</div>
	<script>
		function toggleLogs() {
			var expanded = document.getElementById('split').classList.toggle('logs-max');
			document.getElementById('expandLogs').innerText = expanded ? 'Show activity' : 'Expand logs';
		}
		function fetchLogs() {
			var now = new Date();
			$('#last-update').text(now.toLocaleString());
		}
		fetchLogs();
		setInterval(fetchLogs, 1000);
	</script>
</body>
</html>
