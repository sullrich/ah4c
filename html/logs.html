<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Log Viewer — AH4C</title>
	<link rel="stylesheet" href="/static/css/ah4c.css?v=3">
	<script src="/static/js/theme.js?v=3"></script>
	<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
</head>
<body>
	<div class="shell">
		<div class="pagebar" id="time-header">
			<a href="/"><img class="pagebar-logo" src="/static/logos/androidhdmi-for-channels.jpeg" alt="AH4C"></a>
			<strong>Logs</strong>
			<span>Last updated: <span id="last-update"></span></span>
			<span>showing last <span id="line-cap"></span> lines</span>
			<nav class="nav push-right">
				<a href="/">Home</a>
				<a href="/device">Device Control</a>
				<a href="/status">Activity</a>
				<a href="/status/andlogs">Activity &amp; Logs</a>
				<a href="/logs" class="active">Logs</a>
				<a href="/m3us">Channel M3Us</a>
				<a href="/routes">API Routes</a>
			</nav>
			<button class="btn btn-sm btn-icon theme-toggle" onclick="toggleTheme()" title="Toggle theme">
				<svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="7" y2="7"/><line x1="17" y1="17" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="7" y2="17"/><line x1="17" y1="7" x2="19.1" y2="4.9"/></svg>
				<svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
			</button>
		</div>
		<div class="shell-body">
			<div id="log-content" class="log-viewport"></div>
		</div>
	</div>
	<script>
		if (window.self !== window.top || new URLSearchParams(window.location.search).has('notime')) {
			document.getElementById('time-header').classList.add('hidden');
		}
	</script>
	<script>
		var autoScroll = true;
		var MAX_LOG_LINES = 500;
		var MAX_LOG_BYTES = 262144;
		var lastRendered = '';
		$('#line-cap').text(MAX_LOG_LINES);
		function fetchLogs() {
			$.get('/logs/text?tail=' + MAX_LOG_LINES, function(data) {
				var logContentDiv = $('#log-content');
				var shouldScroll = autoScroll && (logContentDiv.scrollTop() + logContentDiv.innerHeight() >= logContentDiv[0].scrollHeight);
				if (data.length > MAX_LOG_BYTES) {
				    data = data.slice(data.length - MAX_LOG_BYTES);
				}
				// Cap displayed lines so the DOM can't grow without bound
				var lines = data.split('\n');
				if (lines.length > MAX_LOG_LINES) {
					lines = lines.slice(lines.length - MAX_LOG_LINES);
				}
				data = lines.join('\n');
				// Array of search and replace items
				var replaceItems = [
					{search: 'Failure', replace: '<span class="tk-err-soft">Failure</span>'},
					{search: '404', replace: '<span class="tk-err-soft">404</span>'},
					{search: '200', replace: '<span class="tk-ok">200</span>'},
					{search: '304', replace: '<span class="tk-ok-soft">304</span>'},
					{search: 'started', replace: '<span class="tk-ok-soft">started</span>'},
					{search: 'successfully', replace: '<span class="tk-ok-soft">successfully</span>'},
					{search: 'ready', replace: '<span class="tk-ok-soft">ready</span>'},
					{search: 'START', replace: '<span class="tk-ok">START</span>'},
					{search: 'SUCCESS', replace: '<span class="tk-ok">SUCCESS</span>'},
					{search: 'ENV', replace: '<span class="tk-info">ENV</span>'},
					{search: 'ERROR', replace: '<span class="tk-err">ERROR</span>'},
					{search: 'FAIL', replace: '<span class="tk-err">FAIL</span>'},
					{search: 'WAITING', replace: '<span class="tk-muted">WAITING</span>'},
					{search: 'WARNING', replace: '<span class="tk-warn">WARNING</span>'},
					{search: 'EXECUTE', replace: '<span class="tk-info">EXECUTE</span>'},
					{search: 'STOPPING', replace: '<span class="tk-warn">STOPPING</span>'},
					{search: 'CONNECTING', replace: '<span class="tk-info">CONNECTING</span>'},
					{search: 'TUNEIN', replace: '<span class="tk-info">TUNEIN</span>'},
					{search: 'STATS', replace: '<span class="tk-info">STATS</span>'},
					{search: 'GIN-debug', replace: '<span class="tk-accent">GIN-debug</span>'},
					{search: 'waiting', replace: '<span class="tk-muted">waiting</span>'}
				];
				data = data.replace(/[&<>"']/g, function(c) {
				    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
				});
				// For each item in the array, replace in the data
				replaceItems.forEach(function(item) {
				    data = data.replace(new RegExp(item.search, 'g'), item.replace);
				});
				// Replace line breaks with HTML line breaks
				var rendered = data.replace(/\n/g, '<br>');
				if (rendered !== lastRendered) {
				    lastRendered = rendered;
				    $('#log-content').html(rendered);
				}
				var now = new Date();
				$('#last-update').text(now.toLocaleString());
				if (shouldScroll) {
				    logContentDiv.scrollTop(logContentDiv[0].scrollHeight);
				}
			}).always(function() {
				setTimeout(fetchLogs, 1000);
			});
		}
		$(document).ready(function() {
			$('#log-content').on('scroll', function() {
				autoScroll = $(this).scrollTop() + $(this).innerHeight() >= $(this)[0].scrollHeight;
			});
			fetchLogs();
		});
	</script>
</body>
</html>
