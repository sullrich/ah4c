<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config — AH4C</title>
    <link rel="stylesheet" href="/static/css/ah4c.css">
    <script>
        let tunerCount = {{len .Tuners}};
        function addTuner() {
            tunerCount++;
            let html = `
            <div class="tuner-card">
                <div class="tuner-card-header">
                    <span class="tuner-number">${tunerCount}</span>
                    <h3>Tuner ${tunerCount}</h3>
                    <span class="spacer"></span>
                    <button type="button" class="btn btn-danger btn-sm" onclick="deleteTuner(this)">Delete</button>
                </div>
                <div class="pair">
                    <div class="field">
                        <label>Tuner IP <span class="muted">(device)</span></label>
                        <input type="text" name="TUNER${tunerCount}_IP" value="" placeholder="hostname:5555">
                    </div>
                    <div class="pair-link">⇄</div>
                    <div class="field">
                        <label>Encoder URL</label>
                        <input type="text" name="ENCODER${tunerCount}_URL" value="" placeholder="http://encoder/0.ts">
                    </div>
                </div>
                <div class="field">
                    <label>CMD</label>
                    <input type="text" name="CMD${tunerCount}" value="">
                </div>
            </div>`;
            document.getElementById('tuners').insertAdjacentHTML('beforeend', html);
        }
        function deleteTuner(button) {
            button.closest('.tuner-card').remove();
        }
        function cancelForm() {
            window.location.href = "/";
        }
    </script>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a class="brand" href="/">
                <img src="/static/logos/androidhdmi-for-channels.jpeg" alt="AH4C">
                <span>Configuration<small>AH4C</small></span>
            </a>
            <nav class="nav">
                <a href="/">Home</a>
                <a href="/device">Device Control</a>
                <a href="/status">Activity</a>
                <a href="/status/andlogs">Activity &amp; Logs</a>
                <a href="/logs">Logs</a>
                <a href="/m3us">Channel M3Us</a>
                <a href="/routes">API Routes</a>
            </nav>
        </div>

        <form action="/configsave" method="post">
            <div class="card">
                <div class="card-title">Global Variables</div>
                {{range .EnvVariables}}
                <div class="field-row">
                    <label>{{.Key}}</label>
                    <input type="text" name="{{.Key}}" value="{{.Value}}">
                </div>
                {{end}}
            </div>

            <div class="card">
                <div class="card-title">Tuners <span class="hint">— each card pairs a streaming device with its encoder</span></div>
                <div id="tuners" class="tuner-grid">
                    {{range .Tuners}}
                    <div class="tuner-card">
                        <div class="tuner-card-header">
                            <span class="tuner-number">{{.Number}}</span>
                            <h3>Tuner {{.Number}}</h3>
                            <span class="spacer"></span>
                            <button type="button" class="btn btn-danger btn-sm" onclick="deleteTuner(this)">Delete</button>
                        </div>
                        <div class="pair">
                            <div class="field">
                                <label>Tuner IP <span class="muted">(device)</span></label>
                                <input type="text" name="TUNER{{.Number}}_IP" value="{{.TunerIp}}" placeholder="hostname:5555">
                            </div>
                            <div class="pair-link">⇄</div>
                            <div class="field">
                                <label>Encoder URL</label>
                                <input type="text" name="ENCODER{{.Number}}_URL" value="{{.EncoderUrl}}" placeholder="http://encoder/0.ts">
                            </div>
                        </div>
                        <div class="field">
                            <label>CMD</label>
                            <input type="text" name="CMD{{.Number}}" value="{{.Cmd}}">
                        </div>
                    </div>
                    {{end}}
                </div>
            </div>

            <div class="btn-row">
                <button type="button" class="btn" onClick="addTuner()">Add tuner</button>
                <button type="submit" class="btn btn-success">Save</button>
                <button type="button" class="btn btn-danger" onClick="cancelForm()">Cancel</button>
            </div>
        </form>
    </div>
</body>
</html>
