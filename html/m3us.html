<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>M3U Files — AH4C</title>
    <link rel="stylesheet" href="/static/css/ah4c.css">
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a class="brand" href="/">
                <img src="/static/logos/androidhdmi-for-channels.jpeg" alt="AH4C">
                <span>Channel M3Us<small>AH4C</small></span>
            </a>
            <nav class="nav">
                <a href="/">Home</a>
                <a href="/device">Device</a>
                <a href="/status">Activity</a>
                <a href="/status/andlogs">Activity &amp; Logs</a>
                <a href="/logs">Logs</a>
                <a href="/m3us" class="active">M3Us</a>
                <a href="/routes">Routes</a>
            </nav>
        </div>

        <div class="card">
            <div class="card-title">M3U Files</div>
            <div class="menu-grid">
                {{range .m3us}}
                <a href="/editm3u/{{.}}" class="menu-item">
                    <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="13" rx="2"/><polyline points="8 3 12 7 16 3"/></svg></span>
                    <span class="menu-label mono">{{.}}</span>
                </a>
                {{end}}
            </div>
        </div>

        <div class="btn-row">
            <button class="btn btn-danger" onclick="cancel()">Cancel</button>
        </div>
    </div>
    <script>
        function cancel() {
            window.location.href = "/";
        }
    </script>
</body>
</html>
