services:
  ah4c:
    image: mackid1993/ah4c:${TAG:-latest}
    container_name: ah4c-test
    hostname: ah4c-test
    restart: unless-stopped

    # These are Docker host settings. They cannot be configured in settings.json.
    runtime: ${DOCKER_RUNTIME:-runc}
    devices:
      - ${GPU_DEVICE:-/dev/null} # Intel or AMD graphics only: uncomment GPU_DEVICE=/dev/dri in ah4c-minimal.env.
    ports:
      - ${HOST_PORT:-7654}:7654

    environment:
      - AH4C_HOST_DIR_CONFIGURED=${HOST_DIR:+true} # Internal safety check: blank means HOST_DIR was not set.
    # NVIDIA users: uncomment the NVIDIA values in ah4c-minimal.env and these lines.
    #   - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES}
    #   - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES}

    volumes:
      - ${HOST_DIR}/ah4c/config:/opt/config # Settings saved from the web interface
      - ${HOST_DIR}/ah4c/scripts:/opt/scripts # Streamer scripts downloaded or added locally
      - ${HOST_DIR}/ah4c/m3u:/opt/m3u # M3U files
      - ${HOST_DIR}/ah4c/adb:/root/.android # Persistent ADB keys
      - ${HOST_DIR}/ah4c/captions:/opt/captions # Closed caption files
      - ${HOST_DIR}/ah4c/preroll:/opt/preroll # Pre-roll media

    # No application environment variables are required. The first-run wizard
    # saves an optional streamer choice and any tuners to /opt/config/settings.json.
