name: Build image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: false
        default: latest
      no_cache:
        description: Ignore the layer cache and re-clone from scratch (untick only for a faster rebuild of unchanged code)
        type: boolean
        required: false
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: cdvr
        run: echo "release=$(curl -fsSL https://channels-dvr.s3.amazonaws.com/latest.txt | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ inputs.no_cache }}
          build-args: |
            CDVR_RELEASE=${{ steps.cdvr.outputs.release }}
          tags: ghcr.io/${{ github.repository_owner }}/ah4c:${{ inputs.tag }}
